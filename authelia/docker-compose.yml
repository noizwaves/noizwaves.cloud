version: '3.7'

services:
  authelia:
    image: authelia/authelia:latest@sha256:1b363e9279e742397966333f364e0876ae02bf5c876de73e83af6d48c57ff51b
    container_name: authelia
    user: "1000:1000"
    volumes:
      - ./config:/config
    networks:
      - web
      - backend
    environment:
      - AUTHELIA_JWT_SECRET_FILE=/run/secrets/jwt
      - AUTHELIA_SESSION_SECRET_FILE=/run/secrets/session
      - AUTHELIA_STORAGE_MYSQL_PASSWORD_FILE=/run/secrets/mysql_password
    secrets:
      - jwt
      - session
      - mysql_password
    labels:
      - 'traefik.enable=true'
      - traefik.http.routers.authelia.rule=Host(`authelia.${CLOUD_DOMAIN}`)
      - 'traefik.http.routers.authelia.entrypoints=web-secured'
      - 'traefik.http.routers.authelia.tls=true'
      - 'traefik.http.routers.authelia.tls.certresolver=mytlschallenge'

      - "traefik.http.middlewares.authelia.forwardauth.address=http://authelia:9091/api/verify?rd=https://authelia.${CLOUD_DOMAIN}/"
      - 'traefik.http.middlewares.authelia.forwardauth.trustForwardHeader=true'
      - 'traefik.http.middlewares.authelia.forwardauth.authResponseHeaders=Remote-User, Remote-Groups'

    restart: unless-stopped
    depends_on:
      - redis
      - mariadb

  redis:
    image: redis:6.0.5@sha256:800f2587bf3376cb01e6307afe599ddce9439deafbd4fb8562829da96085c9c5
    container_name: authelia_redis
    restart: unless-stopped
    networks:
      - backend
    volumes:
      - ../../cloud-data/authelia/redis:/data

  mariadb:
    image: linuxserver/mariadb:11.4.5-r0-ls185@sha256:65e4fb3328ba5b402dc98822b7727d0dc266a5e9a827aad3f0e47bf065d4afc1
    container_name: authelia_mariadb
    restart: unless-stopped
    networks:
      - backend
    env_file:
      - .env
    environment:
      - PUID=1000
      - PGID=1000
      - MYSQL_USER=authelia
      - MYSQL_DATABASE=authelia
      - MYSQL_RANDOM_ROOT_PASSWORD=yes
    volumes:
      - ../../cloud-data/authelia/mariadb:/config

secrets:
  jwt:
    file: .secrets/jwt.txt

  session:
    file: .secrets/session.txt

  mysql_password:
    file: .secrets/mysql_password.txt

networks:
  web:
    external: true

  backend:
    external: false
    internal: true
