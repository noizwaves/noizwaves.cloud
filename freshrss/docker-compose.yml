services:
  freshrss:
    image: lscr.io/linuxserver/freshrss:1.30.4-ls327@sha256:3bdf970c2baebb4e8c8753c84e44c87991888311a437466d669b0016bb7e89c5
    container_name: freshrss
    restart: unless-stopped
    networks:
      - web
      - backend
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=${TZ}
    volumes:
      - ../../cloud-data/freshrss/config:/config
    depends_on:
      - mariadb
    labels:
      - traefik.enable=true
      - traefik.http.services.freshrss.loadbalancer.server.port=80

      # HTTPS
      - traefik.http.routers.freshrss.rule=Host(`freshrss.${CLOUD_DOMAIN}`)
      - traefik.http.routers.freshrss.tls.certresolver=mytlschallenge
      - traefik.http.routers.freshrss.entrypoints=web-secured
      - traefik.http.routers.freshrss.tls=true
      - traefik.http.routers.freshrss.service=freshrss

  mariadb:
    image: lscr.io/linuxserver/mariadb:11.8.9-r0-ls237@sha256:dfd0f601cedf95381781c1b9b27424c608a78ddd97faa484da678873240f65e6
    container_name: freshrss_mariadb
    restart: unless-stopped
    networks:
      - backend
    env_file:
      - .env
    environment:
      - MYSQL_DATABASE=freshrss
      - PUID=1000
      - PGID=1000
    volumes:
      - ../../cloud-data/freshrss/mariadb:/config

networks:
  web:
    external: true
  backend:
    external: false
    internal: false
