services:
  freshrss:
    image: lscr.io/linuxserver/freshrss:1.31.0-ls333@sha256:ad35910b3396901b35ed08359d1b8a7c8e1d017fce98ef3564cc8e76478bd6aa
    container_name: freshrss
    restart: unless-stopped
    networks:
      - web
      - backend
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=${TZ}
    volumes:
      - ../../cloud-data/freshrss/config:/config
    depends_on:
      - mariadb
    labels:
      - traefik.enable=true
      - traefik.http.services.freshrss.loadbalancer.server.port=80

      # HTTPS
      - traefik.http.routers.freshrss.rule=Host(`freshrss.${CLOUD_DOMAIN}`)
      - traefik.http.routers.freshrss.tls.certresolver=mytlschallenge
      - traefik.http.routers.freshrss.entrypoints=web-secured
      - traefik.http.routers.freshrss.tls=true
      - traefik.http.routers.freshrss.service=freshrss

  mariadb:
    image: lscr.io/linuxserver/mariadb:11.8.10-r0-ls241@sha256:4d9fb8985c06b2099d8421fb4070c4db0f61f3973e3b6828f6607cb0853f292d
    container_name: freshrss_mariadb
    restart: unless-stopped
    networks:
      - backend
    env_file:
      - .env
    environment:
      - MYSQL_DATABASE=freshrss
      - PUID=1000
      - PGID=1000
    volumes:
      - ../../cloud-data/freshrss/mariadb:/config

networks:
  web:
    external: true
  backend:
    external: false
    internal: false
