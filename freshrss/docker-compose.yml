services:
  freshrss:
    image: lscr.io/linuxserver/freshrss:1.29.1-ls309@sha256:b24ddde7d465f004847305b70d2479eb31c218e777bf2ab97d42dc75b54ed914
    container_name: freshrss
    restart: unless-stopped
    networks:
      - web
      - backend
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=${TZ}
    volumes:
      - ../../cloud-data/freshrss/config:/config
    depends_on:
      - mariadb
    labels:
      - traefik.enable=true
      - traefik.http.services.freshrss.loadbalancer.server.port=80

      # HTTPS
      - traefik.http.routers.freshrss.rule=Host(`freshrss.${CLOUD_DOMAIN}`)
      - traefik.http.routers.freshrss.tls.certresolver=mytlschallenge
      - traefik.http.routers.freshrss.entrypoints=web-secured
      - traefik.http.routers.freshrss.tls=true
      - traefik.http.routers.freshrss.service=freshrss

  mariadb:
    image: lscr.io/linuxserver/mariadb:11.8.8-r0-ls232@sha256:71eb1840431c36d5ff4985afc7b59072c5de3d8a91fe5353b5791f7a6e9fb7f5
    container_name: freshrss_mariadb
    restart: unless-stopped
    networks:
      - backend
    env_file:
      - .env
    environment:
      - MYSQL_DATABASE=freshrss
      - PUID=1000
      - PGID=1000
    volumes:
      - ../../cloud-data/freshrss/mariadb:/config

networks:
  web:
    external: true
  backend:
    external: false
    internal: false
