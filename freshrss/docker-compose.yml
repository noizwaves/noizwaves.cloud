services:
  freshrss:
    image: lscr.io/linuxserver/freshrss:1.30.0-ls323@sha256:50f295fe361b2ef467a65232ab488ef161f8a0d6815d28b918c29fcb4a9c9690
    container_name: freshrss
    restart: unless-stopped
    networks:
      - web
      - backend
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=${TZ}
    volumes:
      - ../../cloud-data/freshrss/config:/config
    depends_on:
      - mariadb
    labels:
      - traefik.enable=true
      - traefik.http.services.freshrss.loadbalancer.server.port=80

      # HTTPS
      - traefik.http.routers.freshrss.rule=Host(`freshrss.${CLOUD_DOMAIN}`)
      - traefik.http.routers.freshrss.tls.certresolver=mytlschallenge
      - traefik.http.routers.freshrss.entrypoints=web-secured
      - traefik.http.routers.freshrss.tls=true
      - traefik.http.routers.freshrss.service=freshrss

  mariadb:
    image: lscr.io/linuxserver/mariadb:11.8.8-r0-ls234@sha256:7f993451c80a8984dabda504bce9660f4809f6aa1dc9ae4d534462af7058fd4b
    container_name: freshrss_mariadb
    restart: unless-stopped
    networks:
      - backend
    env_file:
      - .env
    environment:
      - MYSQL_DATABASE=freshrss
      - PUID=1000
      - PGID=1000
    volumes:
      - ../../cloud-data/freshrss/mariadb:/config

networks:
  web:
    external: true
  backend:
    external: false
    internal: false
