services:
  sabnzbd:
    image: lscr.io/linuxserver/sabnzbd:5.1.3-ls274@sha256:4f7ee6c53834bc336365bd0a7c35f4fc870156a72d33a334753010258aa077a4
    container_name: sabnzbd
    restart: unless-stopped
    networks:
      - web
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=${TZ}
    volumes:
      - ../../cloud-data/sabnzbd/config:/config
      - /merged/media/Arr:/data
    labels:
      - traefik.enable=true
      - traefik.http.services.sabnzbd.loadbalancer.server.port=8080

      # HTTPS
      - traefik.http.routers.sabnzbd.rule=Host(`sabnzbd.${CLOUD_DOMAIN}`)
      - traefik.http.routers.sabnzbd.tls.certresolver=mytlschallenge
      - traefik.http.routers.sabnzbd.entrypoints=web-secured
      - traefik.http.routers.sabnzbd.tls=true
      - traefik.http.routers.sabnzbd.service=sabnzbd

  sonarr:
