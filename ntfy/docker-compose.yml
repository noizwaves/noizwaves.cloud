services:
  ntfy:
    image: docker.io/binwiederhier/ntfy:v2.30.0@sha256:8563a39da2f5a47360618b2ab9200239c76b37f4145f6d627d9ab4368abd23f0
    container_name: ntfy
    restart: unless-stopped
    user: "1000:1000"
    networks:
      - web
      - ntfy
    command:
      - serve
    environment:
      - TZ=${TZ}
    volumes:
      - ./server.yml:/etc/ntfy/server.yml
      - ../../cloud-data/ntfy:/var/cache/ntfy
    # healthcheck:
    #     test: ["CMD-SHELL", "wget -q --tries=1 http://localhost:80/v1/health -O - | grep -Eo '\"healthy\"\\s*:\\s*true' || exit 1"]
    #     interval: 60s
    #     timeout: 10s
    #     retries: 3
    #     start_period: 40s
    labels:
      - traefik.enable=true

      - traefik.http.services.ntfy.loadbalancer.passhostheader=true
      - traefik.http.services.ntfy.loadbalancer.server.port=80

      - traefik.http.routers.ntfy.rule=Host(`ntfy.${CLOUD_DOMAIN}`)
      - traefik.http.routers.ntfy.service=ntfy
      - traefik.http.routers.ntfy.entrypoints=web-secured
      - traefik.http.routers.ntfy.tls=true
      - traefik.http.routers.ntfy.tls.certresolver=mytlschallenge

networks:
  web:
    external: true
  ntfy:
    external: false
    internal: true
    name: ntfy
