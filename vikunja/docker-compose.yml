version: '3.7'

services:
  app:
    image: vikunja/vikunja:2.6.0@sha256:417ada6f94e81f0267aa2f007d0a811fc82d38dd2aa58351e3ea520ca01c2ea5
    container_name: vikunja
    environment:
      - PUID=1000
      - PGID=1000
      # Required since v1.0: Vikunja refuses to start without it, and it is the
      # origin allowed by the now-on-by-default CORS check.
      - VIKUNJA_SERVICE_PUBLICURL=https://vikunja.${CLOUD_DOMAIN}/
    env_file:
      - .env
    volumes:
      - ../../cloud-data/vikunja/files:/app/vikunja/files
    networks:
      - web
      - backend
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    labels:
      - traefik.enable=true

      ## Service settings
      - traefik.http.services.vikunja.loadbalancer.server.port=3456
      - traefik.http.services.vikunja.loadbalancer.passhostheader=true

      ## HTTPS
      - traefik.http.routers.vikunja.rule=Host(`vikunja.${CLOUD_DOMAIN}`)
      - traefik.http.routers.vikunja.entrypoints=web-secured
      - traefik.http.routers.vikunja.service=vikunja
      - traefik.http.routers.vikunja.tls=true
      - traefik.http.routers.vikunja.tls.certresolver=mytlschallenge

  db:
    image: lscr.io/linuxserver/mariadb:11.8.8@sha256:cb61ec331e80b2ad1c9c5837238eaec91a356bbd952d8a0f58f5054e0e79fdf5
    container_name: vikunja_db
    restart: unless-stopped
    networks:
      - backend
    env_file:
      - .env
    environment:
      - PUID=1000
      - PGID=1000
    volumes:
      - ../../cloud-data/vikunja/mariadb:/config
    healthcheck:
      test: [ "CMD", "mariadb-admin", "ping", "-h", "localhost" ]
      interval: 5s
      timeout: 5s
      retries: 10

networks:
  web:
    external: true

  backend:
    external: false
    internal: true
