services:
  app:
    image: ghcr.io/atuinsh/atuin:18.22.0@sha256:1e94eb5c2fb6bb1e46da2591648efa11aa9507fcd80ddf812e4acbfe51d8a840
    container_name: atuin
    restart: unless-stopped
    networks:
      - web
      - backend
    links:
      - db
    command: start
    environment:
      - ATUIN_HOST=0.0.0.0
      #ATUIN_OPEN_REGISTRATION: "true"
      - ATUIN_DB_URI=postgres://$ATUIN_DB_USERNAME:$ATUIN_DB_PASSWORD@db/$ATUIN_DB_NAME
      - RUST_LOG=info,atuin_server=debug
    volumes:
      - "../../cloud-data/atuin/config:/config"
    labels:
      - traefik.enable=true

      - traefik.http.services.atuin.loadbalancer.passhostheader=true
      - traefik.http.services.atuin.loadbalancer.server.port=8888

      - traefik.http.routers.atuin.rule=Host(`atuin.${CLOUD_DOMAIN}`)
      - traefik.http.routers.atuin.service=atuin
      - traefik.http.routers.atuin.entrypoints=web-secured
      - traefik.http.routers.atuin.tls=true
      - traefik.http.routers.atuin.tls.certresolver=mytlschallenge

  db:
    image: docker.io/postgres:18.6-alpine@sha256:d3e1620b530c944afa6e887d22eb899824da68e19c52024bf98f5220c88a65b2
    container_name: atuin_postgres
    restart: unless-stopped
    user: "1000:1000"
    networks:
      - backend
    environment:
      - POSTGRES_USER=${ATUIN_DB_USERNAME}
      - POSTGRES_PASSWORD=${ATUIN_DB_PASSWORD}
      - POSTGRES_DB=${ATUIN_DB_NAME}
    volumes:
      - "../../cloud-data/atuin/postgres:/var/lib/postgresql"

networks:
  web:
    external: true
  backend:
    external: false
    internal: true
