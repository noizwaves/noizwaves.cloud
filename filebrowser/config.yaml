server:
  database:
    path: "/home/filebrowser/data/filebrowser.sqlite"
  cacheDir: "/home/filebrowser/data/cache"
  logging:
    - levels: "info|warning|error"

  # Enable sources for users created on their first Authelia login.
  sources:
    - path: "/srv/baedrive"
      name: "Baedrive"
      config:
        defaultEnabled: true
    - path: "/srv/doc-sync"
      name: "Doc Sync"
      config:
        defaultEnabled: true
    - path: "/srv/encrypted"
      name: "Encrypted"
      config:
        defaultEnabled: true
    - path: "/srv/pictures"
      name: "Pictures"
      config:
        defaultEnabled: true
    - path: "/srv/storage"
      name: "Storage"
      config:
        defaultEnabled: true
    - path: "/srv/media1"
      name: "Media 1"
      config:
        defaultEnabled: true
    - path: "/srv/media2"
      name: "Media 2"
      config:
        defaultEnabled: true
    - path: "/srv/music"
      name: "Music"
      config:
        defaultEnabled: true
        readOnly: true

http:
  port: 8080
  baseURL: "/"
  externalUrl: "https://filebrowser.noizwaves.cloud"
  trustProxyHeaders: true

auth:
  # Authelia is the only way in, so the proxy header is the entire login flow.
  # The user matching adminUsername is granted admin on creation.
  adminUsername: "adam"
  methods:
    password:
      enabled: false
    proxy:
      enabled: true
      header: "Remote-User"
      logoutRedirectUrl: "https://authelia.noizwaves.cloud/logout"
