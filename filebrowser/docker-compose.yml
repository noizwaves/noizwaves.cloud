services:
  app:
    image: docker.io/gtstef/filebrowser:1.5.6-stable@sha256:7c5d7ac8ffda31294d278063cf9d2e04303b39e6dce1f4c691342240ca7703b8
    container_name: filebrowser
    restart: unless-stopped
    user: "1000:1000"
    networks:
      - web
    environment:
      # Load config from outside the data volume, otherwise docker leaves a
      # root owned stub behind on the host to mount over
      - FILEBROWSER_CONFIG=/home/filebrowser/config.yaml
    volumes:
      - ../../cloud-data/filebrowser/data:/home/filebrowser/data
      - ./config.yaml:/home/filebrowser/config.yaml:ro

      # Files
      - ../../cloud-data/resilio-sync/data/encrypted-data:/srv/encrypted
      - ../../cloud-data/resilio-sync/data/baedrive-data:/srv/baedrive
      - ../../cloud-data/resilio-sync/data/doc-sync-data:/srv/doc-sync
      - ../../cloud-data/resilio-sync/data/storage-data:/srv/storage
      - ../../cloud-data/resilio-sync/data/pictures-data:/srv/pictures

      # Media
      - /mnt/media1:/srv/media1
      - /mnt/media2:/srv/media2

      # Merged media
      - /merged/music:/srv/music:ro
    # The bundled healthcheck hardcodes port 80
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 3s
      start_period: 10s
      retries: 3
    labels:
      - traefik.enable=true

      ## Service settings
      - traefik.http.services.filebrowser.loadbalancer.server.port=8080
      - traefik.http.services.filebrowser.loadbalancer.passhostheader=true

      ## HTTPS
      - traefik.http.routers.filebrowser.rule=Host(`filebrowser.${CLOUD_DOMAIN}`)
      - traefik.http.routers.filebrowser.entrypoints=web-secured
      - traefik.http.routers.filebrowser.service=filebrowser
      - traefik.http.routers.filebrowser.tls=true
      - traefik.http.routers.filebrowser.tls.certresolver=mytlschallenge

      # protect with Authelia
      - traefik.http.routers.filebrowser.middlewares=authelia@docker

networks:
  web:
    external: true
