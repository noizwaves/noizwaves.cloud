services:
  postgres:
    image: docker.io/postgres:18.6-alpine@sha256:d3e1620b530c944afa6e887d22eb899824da68e19c52024bf98f5220c88a65b2
    container_name: tandoor_postgres
    restart: unless-stopped
    user: "1000:1000"
    networks:
      - backend
    env_file:
      - .env
    volumes:
      - ../../cloud-data/tandoor/postgres:/var/lib/postgresql

  # Cache only - Tandoor keeps sessions and everything durable in postgres, so
  # there is nothing here worth persisting or backing up.
  redis:
    image: docker.io/redis:8.10.1-alpine@sha256:becdda6c7f4b3fb42e42fd7f120bbf5c54c4caaaf16f26da24e4563d2c1f0576
    container_name: tandoor_redis
    restart: unless-stopped
    user: "1000:1000"
    networks:
      - backend
    # Empty --save plus no AOF means purely in-memory; LRU eviction caps growth.
    command: ["redis-server", "--save", "", "--appendonly", "no", "--maxmemory", "256mb", "--maxmemory-policy", "allkeys-lru"]

  app:
    image: docker.io/vabene1111/recipes:2.6.14@sha256:d75d8ebaac6a21df76da59f71cc300b172cb8f611b8cfa1038025cfbebc27566
    container_name: tandoor_app
    # built-in Nginx config requires a specific hostname to function
    # https://github.com/TandoorRecipes/recipes/blob/c25a1df480c3c0a1f5a282b4968c1efad07e69a6/nginx/conf.d/Recipes.conf#L22
    hostname: web_recipes
    restart: unless-stopped
    networks:
      - backend
      - web
    env_file:
      - .env
    volumes:
      - ../../cloud-data/tandoor/staticfiles:/opt/recipes/staticfiles
      - ../../cloud-data/tandoor/mediafiles:/opt/recipes/mediafiles
    depends_on:
      - postgres
      - redis
    labels:
      - traefik.enable=true

      ## Service settings
      - traefik.http.services.tandoor.loadbalancer.server.port=80
      - traefik.http.services.tandoor.loadbalancer.passhostheader=true

      ## HTTPS
      - traefik.http.routers.tandoor.rule=Host(`tandoor.${CLOUD_DOMAIN}`)
      - traefik.http.routers.tandoor.entrypoints=web-secured
      - traefik.http.routers.tandoor.service=tandoor
      - traefik.http.routers.tandoor.tls=true
      - traefik.http.routers.tandoor.tls.certresolver=mytlschallenge

networks:
  backend:
    external: false
    internal: true

  web:
    external: true
