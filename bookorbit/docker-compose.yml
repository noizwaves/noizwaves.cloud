services:
  app:
    image: ghcr.io/bookorbit/bookorbit:3.5.0@sha256:1534bc7d696179141875b0298ea7916be4469eb2eb9250347873eaaa9728b5a8
    container_name: bookorbit
    restart: unless-stopped
    init: true
    networks:
      - web
      - backend
    environment:
      - NODE_ENV=production
      - PORT=3000
      - PUID=1000
      - PGID=1000
      - TZ=${TZ}
      - APP_URL=https://bookorbit.${CLOUD_DOMAIN}
      - CLIENT_URL=https://bookorbit.${CLOUD_DOMAIN}
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      - POSTGRES_DB=${POSTGRES_DB}
      - JWT_SECRET=${JWT_SECRET:?Set JWT_SECRET in .env}
      - PODCAST_ENCRYPTION_KEY=${PODCAST_ENCRYPTION_KEY:?Set PODCAST_ENCRYPTION_KEY in .env}
      - SETUP_BOOTSTRAP_TOKEN=${SETUP_BOOTSTRAP_TOKEN:?Set SETUP_BOOTSTRAP_TOKEN in .env}
      - NODE_MAX_OLD_SPACE_SIZE=auto
      - LIBRARY_BROWSE_ROOT=/books
    volumes:
      - ../../cloud-data/bookorbit/data:/data
      - /mnt/media2/Books:/books:ro
    depends_on:
      postgres:
        condition: service_healthy
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER
      - SETGID
      - SETUID
    security_opt:
      - no-new-privileges:true
    stop_grace_period: 30s
    labels:
      - traefik.enable=true

      ## Service settings
      - traefik.http.services.bookorbit.loadbalancer.server.port=3000
      - traefik.http.services.bookorbit.loadbalancer.passhostheader=true

      ## HTTPS
      - traefik.http.routers.bookorbit.rule=Host(`bookorbit.${CLOUD_DOMAIN}`)
      - traefik.http.routers.bookorbit.entrypoints=web-secured
      - traefik.http.routers.bookorbit.service=bookorbit
      - traefik.http.routers.bookorbit.tls=true
      - traefik.http.routers.bookorbit.tls.certresolver=mytlschallenge

  postgres:
    image: docker.io/pgvector/pgvector:0.8.7-pg18@sha256:2358fcba361ed2233a5ed81b5fe4ca779ccb304120ce531a3bf51c0ed7e2bc11
    container_name: bookorbit_postgres
    restart: unless-stopped
    user: "1000:1000"
    networks:
      - backend
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      - POSTGRES_DB=${POSTGRES_DB}
    volumes:
      - ../../cloud-data/bookorbit/postgres:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

networks:
  backend:
    external: false
    internal: true
  web:
    external: true
